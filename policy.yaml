apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-loadgenerator-to-frontend
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: loadgenerator
  egress:
  - toEndpoints:
    - matchLabels:
        app: frontend
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-frontend-from-loadgenerator
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: frontend
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: loadgenerator
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
